<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoHybrid - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .header { text-align: center; padding: 20px 0; }
        .header h1 { font-size: 28px; color: #ff0080; }
        .header p { color: #8892b0; font-size: 14px; }
        .status-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .status-pill { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-pill.online { background: #00d4aa; color: #1a1a2e; }
        .status-pill.offline { background: #e74c3c; color: #fff; }
        .status-pill.auto { background: #ff0080; color: #fff; }
        .status-pill.strat { background: #3498db; color: #fff; }
        .status-pill.comfort { background: #f39c12; color: #fff; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .card-title { font-size: 14px; color: #8892b0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .climate-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .climate-item:last-child { border-bottom: none; }
        .climate-name { font-weight: 600; font-size: 16px; }
        .climate-temp { font-size: 24px; color: #00d4aa; }
        .climate-state { font-size: 12px; color: #8892b0; }
        .controls { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn-primary { background: #00d4aa; color: #1a1a2e; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-warning { background: #ff0080; color: #fff; }
        .temp-control { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
        .temp-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 20px; cursor: pointer; }
        .temp-value { font-size: 28px; font-weight: 700; min-width: 60px; text-align: center; }
        .sensor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .sensor-box { background: rgba(0,212,170,0.1); border: 1px solid rgba(0,212,170,0.2); border-radius: 12px; padding: 15px; text-align: center; }
        .sensor-value { font-size: 24px; font-weight: 700; color: #00d4aa; }
        .sensor-label { font-size: 11px; color: #8892b0; margin-top: 5px; }
        .loading { text-align: center; padding: 40px; color: #8892b0; }
        .error { text-align: center; padding: 20px; color: #e74c3c; background: rgba(231,76,60,0.1); border-radius: 12px; }
        .mode-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .mode-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #8892b0; cursor: pointer; font-size: 12px; }
        .mode-btn.active { background: #00d4aa; color: #1a1a2e; border-color: #00d4aa; }
        .override-box { background: rgba(255,0,128,0.1); border: 1px solid rgba(255,0,128,0.3); border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; }
        .override-box p { font-size: 13px; color: #b0c4de; margin-bottom: 10px; }
        .strat-box { background: rgba(52,152,219,0.1); border: 1px solid rgba(52,152,219,0.3); border-radius: 12px; padding: 15px; margin-top: 15px; }
        .strat-box h4 { color: #3498db; margin-bottom: 8px; }
        .strat-box p { font-size: 13px; color: #b0c4de; margin-bottom: 5px; }
        .strat-active { background: rgba(0,212,170,0.2); border-color: #00d4aa; }
        .comfort-box { background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.3); border-radius: 12px; padding: 15px; margin-top: 15px; }
        .comfort-box h4 { color: #f39c12; margin-bottom: 8px; }
        .comfort-box p { font-size: 13px; color: #b0c4de; margin-bottom: 5px; }
        .comfort-ok { background: rgba(0,212,170,0.2); border-color: #00d4aa; }
        .deum-box { background: rgba(155,89,182,0.1); border: 1px solid rgba(155,89,182,0.3); border-radius: 12px; padding: 15px; margin-top: 15px; }
        .deum-box h4 { color: #9b59b6; margin-bottom: 8px; }
        .deum-box p { font-size: 13px; color: #b0c4de; margin-bottom: 5px; }
        .weather-box { background: rgba(52,152,219,0.05); border: 1px solid rgba(52,152,219,0.2); border-radius: 12px; padding: 15px; margin-top: 15px; }
        .weather-box h4 { color: #3498db; margin-bottom: 8px; }
        .weather-box p { font-size: 13px; color: #b0c4de; margin-bottom: 5px; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #ff0080; text-decoration: none; }
    </style>
<base target="_blank">
</head>
<body>
    <div class="header">
        <h1>EcoHybrid Dashboard</h1>
        <p>Controllo climatizzazione - Modalita: <span id="algo-mode">AUTO</span></p>
    </div>
    <div class="status-bar">
        <div class="status-pill offline" id="ha-status">HA: Connessione...</div>
        <div class="status-pill auto" id="algo-status">Algoritmo: ON</div>
        <div class="status-pill offline" id="strat-status">Stratificazione: OFF</div>
        <div class="status-pill offline" id="comfort-status">Comfort: --</div>
    </div>
    <div id="content"><div class="loading">Caricamento dati...</div></div>
    <div class="back-link"><a href="/">Torna alla home</a></div>

    <script>
        let algoEnabled = true;

        async function fetchData() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();
                render(data);
            } catch (e) {
                document.getElementById('content').innerHTML = `<div class="error">Errore: ${e.message}</div>`;
            }
        }

        function render(data) {
            const haStatus = document.getElementById('ha-status');
            if (data.haConnected) {
                haStatus.className = 'status-pill online';
                haStatus.textContent = 'HA: Connesso';
            } else {
                haStatus.className = 'status-pill offline';
                haStatus.textContent = 'HA: Offline';
            }

            const stratStatus = document.getElementById('strat-status');
            if (data.stratificazione && data.stratificazione.attivo) {
                stratStatus.className = 'status-pill strat';
                stratStatus.textContent = 'Stratificazione: ATTIVA';
            } else {
                stratStatus.className = 'status-pill offline';
                stratStatus.textContent = 'Stratificazione: OFF';
            }

            const comfortStatus = document.getElementById('comfort-status');
            if (data.comfort) {
                if (data.comfort.inComfort) {
                    comfortStatus.className = 'status-pill comfort';
                    comfortStatus.textContent = 'Comfort: OK';
                } else {
                    comfortStatus.className = 'status-pill offline';
                    comfortStatus.textContent = 'Comfort: ' + data.comfort.suggestion;
                }
            }

            let html = '';

            // Sensori
            if (data.sensors && data.sensors.length > 0) {
                html += `<div class="card"><div class="card-title">Sensori Ambientali</div><div class="sensor-grid">`;
                data.sensors.forEach(s => {
                    html += `<div class="sensor-box"><div class="sensor-value">${s.state}${s.unit}</div><div class="sensor-label">${s.friendly_name}</div></div>`;
                });
                html += `</div></div>`;
            }

            // Meteo esterno
            if (data.weather && data.weather.tempExt !== null) {
                html += `<div class="card weather-box">
                    <div class="card-title">Meteo Esterno (weather.casa)</div>
                    <h4>${data.weather.condition || 'N/D'}</h4>
                    <p><strong>Temperatura:</strong> ${data.weather.tempExt}°C</p>
                    <p><strong>Umidita:</strong> ${data.weather.humidityExt}%</p>
                    <p><strong>Pressione:</strong> ${data.weather.pressure || 'N/D'} hPa</p>
                </div>`;
            }

            // Comfort ASHRAE 55 Inspired
            if (data.comfort) {
                const c = data.comfort;
                html += `<div class="card comfort-box ${c.inComfort ? 'comfort-ok' : ''}">
                    <div class="card-title">Comfort ASHRAE 55 Inspired</div>
                    <h4>${c.inComfort ? 'Zona Comfort Raggiunta' : 'Fuori Zona Comfort'}</h4>
                    <p><strong>Stagione:</strong> ${c.stagione === 'estate' ? 'Estate' : 'Inverno'}</p>
                    <p><strong>Range temperatura:</strong> ${c.tMin}°C - ${c.tMax}°C</p>
                    <p><strong>Range umidita:</strong> ${c.rhMin}% - ${c.rhMax}%</p>
                    <p><strong>Suggerimento:</strong> ${c.suggestion}</p>
                    <p style="color:#8892b0; font-size:11px; margin-top:8px;">${c.note}</p>
                </div>`;
            }

            // Deumidifica
            if (data.deumidifica) {
                const d = data.deumidifica;
                html += `<div class="card deum-box">
                    <div class="card-title">Gestione Umidita (Umidita Assoluta)</div>
                    <h4>Azione: ${d.action.toUpperCase()}</h4>
                    <p><strong>Umidita interna:</strong> ${d.umiditaInt}%</p>
                    <p><strong>Umidita esterna:</strong> ${d.umiditaExt !== null ? d.umiditaExt + '%' : 'N/D'}</p>
                    ${d.uaInt ? `<p><strong>Umidita assoluta interna:</strong> ${d.uaInt} g/m3</p>` : ''}
                    ${d.uaExt ? `<p><strong>Umidita assoluta esterna:</strong> ${d.uaExt} g/m3</p>` : ''}
                    <p style="color:#b0c4de; margin-top:8px;">${d.reason}</p>
                </div>`;
            }

            // Stratificazione
            if (data.stratificazione) {
                const s = data.stratificazione;
                html += `<div class="card strat-box ${s.attivo ? 'strat-active' : ''}">
                    <div class="card-title">Pilastro 1: Riciclo Termico / Destratificazione</div>
                    <h4>${s.attivo ? 'Ventilazione Mescolante ATTIVA' : 'In attesa'}</h4>
                    <p><strong>Delta:</strong> ${s.delta}°C tra clima (alto) e termostato</p>
                    <p><strong>Soglia:</strong> ${s.config ? s.config.deltaMin : '1.0'}°C per attivazione</p>
                    ${s.attivo ? `<p><strong>Consumo:</strong> ${s.consumoW}W (vs 1000W compressore)</p><p><strong>Risparmio stimato:</strong> ${s.risparmio}</p>` : ''}
                    <p style="color:#8892b0; font-size:12px; margin-top:8px;">${s.motivo}</p>
                </div>`;
            }

            // Termostato
            html += `<div class="card">
                <div class="card-title">Termostato Principale</div>
                <div class="climate-item">
                    <div>
                        <div class="climate-name">Stato: ${data.power ? 'ON' : 'OFF'}</div>
                        <div class="climate-state">Temperatura attuale: ${data.currentTemp}°C</div>
                    </div>
                    <div class="climate-temp">${data.targetTemp}°C</div>
                </div>
                <div class="temp-control">
                    <button class="temp-btn" onclick="setTemp(${data.targetTemp - 1})">-</button>
                    <div class="temp-value">${data.targetTemp}</div>
                    <button class="temp-btn" onclick="setTemp(${data.targetTemp + 1})">+</button>
                </div>
                <div class="mode-selector">
                    <button class="mode-btn ${data.mode === 'heat' ? 'active' : ''}" onclick="setMode('heat')">Caldo</button>
                    <button class="mode-btn ${data.mode === 'cool' ? 'active' : ''}" onclick="setMode('cool')">Freddo</button>
                    <button class="mode-btn ${data.mode === 'dry' ? 'active' : ''}" onclick="setMode('dry')">Deumidifica</button>
                    <button class="mode-btn ${data.mode === 'auto' ? 'active' : ''}" onclick="setMode('auto')">Auto</button>
                    <button class="mode-btn ${data.mode === 'fan_only' ? 'active' : ''}" onclick="setMode('fan_only')">Ventilatore</button>
                </div>
                <div class="controls" style="margin-top:15px">
                    <button class="btn btn-primary" onclick="togglePower()">${data.power ? 'SPEGNI' : 'ACCENDI'}</button>
                </div>
                <div class="override-box">
                    <p>L'algoritmo EcoHybrid gestisce automaticamente temperatura, modalita, destratificazione e umidita in base ai costi energetici, effemeridi e comfort ASHRAE 55 Inspired.</p>
                    <button class="btn btn-warning" onclick="toggleAlgo()">${algoEnabled ? 'DISATTIVA ALGORITMO' : 'ATTIVA ALGORITMO'}</button>
                </div>
            </div>`;

            // Altri climate
            if (data.climates && data.climates.length > 1) {
                html += `<div class="card"><div class="card-title">Altre Zone</div>`;
                data.climates.slice(1).forEach(c => {
                    html += `<div class="climate-item">
                        <div>
                            <div class="climate-name">${c.friendly_name}</div>
                            <div class="climate-state">${c.state} | Attuale: ${c.current_temperature != null ? c.current_temperature + '°C' : 'N/D'}</div>
                        </div>
                        <div class="climate-temp">${c.temperature != null ? c.temperature + '°C' : '--'}</div>
                    </div>`;
                });
                html += `</div>`;
            }

            document.getElementById('content').innerHTML = html;
        }

        async function togglePower() {
            const resp = await fetch('/api/status');
            const data = await resp.json();
            const action = data.power ? 'off' : 'on';
            await fetch(`/api/power/${action}`, { method: 'POST' });
            setTimeout(fetchData, 500);
        }

        async function setTemp(temp) {
            await fetch(`/api/temp/${temp}`, { method: 'POST' });
            setTimeout(fetchData, 500);
        }

        async function setMode(mode) {
            await fetch(`/api/mode/${mode}`, { method: 'POST' });
            setTimeout(fetchData, 500);
        }

        function toggleAlgo() {
            algoEnabled = !algoEnabled;
            document.getElementById('algo-status').textContent = algoEnabled ? 'Algoritmo: ON' : 'Algoritmo: OFF';
            document.getElementById('algo-status').className = algoEnabled ? 'status-pill auto' : 'status-pill offline';
            document.getElementById('algo-mode').textContent = algoEnabled ? 'AUTO' : 'MANUALE';
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
